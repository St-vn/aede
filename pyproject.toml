[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aedeai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-ulid>=2.0.0",
    "pyyaml>=6.0.0",
    "ddgs>=9.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
aede = "aede.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aede"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
